name: Feedback on Founder Plus
description: Tell us what worked, what was confusing and what to add.
title: "Feedback: "
labels: ["feedback"]
body:
  - type: dropdown
    id: rating
    attributes:
      label: How useful was it?
      options: ["5 - Very useful", "4 - Useful", "3 - Okay", "2 - Not very useful", "1 - Not useful"]
    validations:
      required: true
  - type: dropdown
    id: used
    attributes:
      label: What did you use?
      multiple: true
      options: ["Customer builder (website)", "Run it in Claude (quick way)", "Claude Code (full way)", "Product Improvement Manager", "Just read the sample report"]
  - type: textarea
    id: liked
    attributes:
      label: What did you like?
  - type: textarea
    id: improve
    attributes:
      label: What was confusing, broken or missing?
    validations:
      required: true
  - type: input
    id: business
    attributes:
      label: What kind of business did you test? (optional)
  - type: dropdown
    id: recommend
    attributes:
      label: Would you recommend it to a friend?
      options: ["Yes", "Maybe", "No"]
